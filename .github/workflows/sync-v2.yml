# 每 10 分鐘讀鏈上 V2 事件（鑄造、解盲、換裝），更新 v2/state.json（穿著以這裡為準），產生圖片與 metadata 並推上 GitHub Pages
# 設定：repo → Settings → Secrets and variables → Actions → Variables 新增 NFT_V2_ADDRESS、FROM_BLOCK（合約部署區塊，deployments/polygon.json 的 blocks.nft；可選 RPC_URL）
name: Sync V2 NFT

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.NFT_V2_ADDRESS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 讀鏈上事件並出圖
        env:
          NFT_V2_ADDRESS: ${{ vars.NFT_V2_ADDRESS }}
          FROM_BLOCK: ${{ vars.FROM_BLOCK }}
          RPC_URL: ${{ vars.RPC_URL }}
        run: python3 scripts/sync_v2.py
      - name: 推上 GitHub
        env:
          NFT_V2_ADDRESS: ${{ vars.NFT_V2_ADDRESS }}
          FROM_BLOCK: ${{ vars.FROM_BLOCK }}
          RPC_URL: ${{ vars.RPC_URL }}
        run: |
          git config user.name "asc-bot"
          git config user.email "asc-bot@users.noreply.github.com"
          git add v2
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "sync v2: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 推送被拒（期間有別的 commit）：抓最新的，合併後重推；合併不了就以最新版重跑一次同步（結果只由鏈上決定，重跑不會錯）
          for i in 1 2 3; do
            git push && exit 0
            echo "推送被拒，第 $i 次重試"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              python3 scripts/sync_v2.py
              git add v2
              if git diff --cached --quiet; then echo "最新版已經是同步過的結果"; exit 0; fi
              git commit -m "sync v2: $(date -u +%Y-%m-%dT%H:%MZ)"
            fi
            sleep $((i * 5))
          done
          exit 1
